<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071411">

<title>A Little Birthday World for Alina ✦</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#050b09;
    --bg2:#091713;
    --emerald:#0e2b22;
    --emerald2:#123d2f;
    --gold:#d8b56a;
    --gold2:#f0d99a;
    --rose:#c97886;
    --cream:#f6efe0;
    --muted:#a9b6ae;
    --glass:rgba(255,255,255,.055);
    --line:rgba(240,217,154,.18);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 20% 10%,rgba(44,100,77,.18),transparent 28%),
        radial-gradient(circle at 80% 40%,rgba(181,113,128,.10),transparent 30%),
        var(--bg);
    color:var(--cream);
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
}

body.locked{
    overflow:hidden;
}

button{
    font-family:inherit;
}

::selection{
    background:rgba(216,181,106,.3);
}

/* =========================
   LOADING / INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:
        radial-gradient(circle at center,rgba(25,71,54,.32),transparent 42%),
        #030806;
    transition:opacity 1s ease,visibility 1s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro-stars,
.star-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.5;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.7)}
    50%{opacity:.9;transform:scale(1.5)}
}

.intro-card{
    position:relative;
    width:min(520px,100%);
    padding:55px 28px 42px;
    text-align:center;
    border:1px solid var(--line);
    background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-radius:30px;
    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08);
    animation:cardIn 1.2s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(35px) scale(.94)}
    to{opacity:1;transform:none}
}

.intro-flower{
    font-size:45px;
    margin-bottom:15px;
    animation:floatFlower 4s ease-in-out infinite;
}

@keyframes floatFlower{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-9px) rotate(4deg)}
}

.eyebrow{
    color:var(--gold);
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:11px;
    margin-bottom:16px;
}

.intro-card h1{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(46px,13vw,78px);
    line-height:.88;
    font-weight:600;
    letter-spacing:1px;
}

.intro-card .sub{
    margin:25px auto 8px;
    color:#ddd5c6;
    font-family:"Cormorant Garamond",serif;
    font-size:25px;
}

.intro-card .tiny{
    color:var(--muted);
    font-size:13px;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:13px;
}

.lux-btn{
    position:relative;
    border:1px solid rgba(240,217,154,.35);
    border-radius:100px;
    padding:14px 28px;
    cursor:pointer;
    color:var(--cream);
    background:rgba(255,255,255,.045);
    transition:.3s ease;
    overflow:hidden;
}

.lux-btn:hover{
    transform:translateY(-3px);
    border-color:var(--gold);
    box-shadow:0 10px 30px rgba(216,181,106,.12);
}

.lux-btn.primary{
    background:linear-gradient(135deg,#b9954e,#e3c47b);
    color:#10120e;
    border:none;
    font-weight:600;
}

.lux-btn.primary:hover{
    box-shadow:0 12px 35px rgba(216,181,106,.28);
}

.no-message{
    min-height:28px;
    margin-top:18px;
    color:#d7a3ad;
    font-size:13px;
    transition:.3s;
}

/* =========================
   MUSIC
========================= */

.music-control{
    position:fixed;
    top:18px;
    right:18px;
    z-index:5000;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 13px;
    border:1px solid var(--line);
    border-radius:100px;
    background:rgba(5,11,9,.72);
    backdrop-filter:blur(15px);
    opacity:0;
    pointer-events:none;
    transition:.5s;
}

.music-control.visible{
    opacity:1;
    pointer-events:auto;
}

.music-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    color:var(--gold2);
    background:rgba(255,255,255,.05);
    cursor:pointer;
}

.music-info{
    font-size:10px;
    letter-spacing:1.5px;
    color:#c9c1b2;
}

.equalizer{
    display:flex;
    align-items:end;
    gap:2px;
    height:16px;
}

.equalizer span{
    display:block;
    width:2px;
    background:var(--gold);
    animation:eq .8s infinite ease-in-out alternate;
}

.equalizer span:nth-child(1){height:7px;animation-delay:.1s}
.equalizer span:nth-child(2){height:13px;animation-delay:.3s}
.equalizer span:nth-child(3){height:9px;animation-delay:.5s}
.equalizer span:nth-child(4){height:15px;animation-delay:.2s}

.equalizer.paused span{
    animation-play-state:paused;
}

@keyframes eq{
    from{transform:scaleY(.35)}
    to{transform:scaleY(1)}
}

/* =========================
   GENERAL
========================= */

main{
    opacity:0;
    transition:opacity 1.2s ease;
}

main.show{
    opacity:1;
}

section{
    position:relative;
    min-height:100vh;
    padding:110px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.container{
    width:min(1100px,100%);
    margin:auto;
}

.section-heading{
    text-align:center;
    margin-bottom:55px;
}

.section-heading .number{
    color:var(--gold);
    letter-spacing:4px;
    font-size:11px;
    margin-bottom:12px;
}

.section-heading h2{
    font-family:"Cormorant Garamond",serif;
    font-weight:500;
    font-size:clamp(42px,9vw,70px);
    line-height:.95;
}

.section-heading p{
    max-width:600px;
    margin:18px auto 0;
    color:var(--muted);
    line-height:1.8;
    font-size:14px;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    text-align:center;
    background:
        radial-gradient(circle at 50% 45%,rgba(33,88,67,.22),transparent 38%);
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-small{
    color:var(--gold);
    letter-spacing:5px;
    font-size:11px;
    text-transform:uppercase;
}

.hero h1{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(70px,18vw,160px);
    font-weight:500;
    line-height:.75;
    margin:25px 0;
    background:linear-gradient(110deg,#fff,#e7cf94,#fff);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#c2cbc5;
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(21px,4vw,31px);
}

.scroll-hint{
    margin-top:55px;
    font-size:10px;
    letter-spacing:3px;
    color:#7d8a83;
    animation:hint 2s infinite;
}

@keyframes hint{
    0%,100%{opacity:.4;transform:translateY(0)}
    50%{opacity:1;transform:translateY(8px)}
}

/* =========================
   PROMISE
========================= */

.promise-card{
    width:min(760px,100%);
    margin:auto;
    padding:60px 30px;
    border-radius:35px;
    text-align:center;
    background:
        linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
    border:1px solid var(--line);
    box-shadow:0 35px 100px rgba(0,0,0,.3);
}

.promise-card .quote{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(28px,6vw,45px);
    line-height:1.15;
}

.promise-card .quote span{
    color:var(--gold2);
}

.promise-card .small-note{
    margin-top:25px;
    color:#909d96;
    font-size:12px;
}

/* =========================
   FLOATING PHOTOS
========================= */

.photo-stage{
    position:relative;
    height:650px;
    max-width:900px;
    margin:auto;
}

.float-photo{
    position:absolute;
    width:clamp(150px,22vw,230px);
    aspect-ratio:3/4;
    padding:9px 9px 34px;
    background:#eee8dc;
    box-shadow:0 25px 60px rgba(0,0,0,.45);
    cursor:pointer;
    transition:transform .5s cubic-bezier(.2,.8,.2,1),z-index .1s;
    animation:photoFloat var(--duration) ease-in-out infinite;
}

.float-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.float-photo::after{
    content:"";
    position:absolute;
    bottom:9px;
    left:0;
    right:0;
    text-align:center;
    color:#3a352d;
    font-family:"Cormorant Garamond",serif;
    font-size:13px;
}

@keyframes photoFloat{
    0%,100%{transform:translate3d(0,0,0) rotate(var(--rot))}
    50%{transform:translate3d(var(--x),-18px,0) rotate(calc(var(--rot) * -1))}
}

.float-photo:hover{
    animation-play-state:paused;
    transform:scale(1.08) rotate(0deg)!important;
    z-index:20!important;
}

.float-photo:nth-child(1){left:3%;top:15%;--rot:-8deg;--x:10px;--duration:6s}
.float-photo:nth-child(2){left:25%;top:4%;--rot:5deg;--x:-8px;--duration:7s}
.float-photo:nth-child(3){left:45%;top:16%;--rot:-3deg;--x:12px;--duration:5.5s}
.float-photo:nth-child(4){right:20%;top:3%;--rot:8deg;--x:-10px;--duration:6.7s}
.float-photo:nth-child(5){right:1%;top:19%;--rot:-6deg;--x:8px;--duration:5.8s}
.float-photo:nth-child(6){left:15%;bottom:4%;--rot:7deg;--x:-12px;--duration:7.2s}
.float-photo:nth-child(7){left:39%;bottom:0;--rot:-7deg;--x:10px;--duration:6.2s}
.float-photo:nth-child(8){right:10%;bottom:5%;--rot:5deg;--x:-8px;--duration:7.5s}

@media(max-width:650px){
    .photo-stage{
        height:600px;
    }

    .float-photo{
        width:145px;
        padding-bottom:29px;
    }

    .float-photo:nth-child(1){left:0;top:10%}
    .float-photo:nth-child(2){left:28%;top:3%}
    .float-photo:nth-child(3){right:0;left:auto;top:16%}
    .float-photo:nth-child(4){left:8%;right:auto;top:39%}
    .float-photo:nth-child(5){right:8%;top:42%}
    .float-photo:nth-child(6){left:0;bottom:3%}
    .float-photo:nth-child(7){left:31%;bottom:0}
    .float-photo:nth-child(8){right:0;bottom:4%}
}

/* =========================
   GIFT BOXES
========================= */

.gifts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20
